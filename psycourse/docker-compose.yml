services:
  db:
    image: postgres:16-alpine
    container_name: psycourse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: psycourse
      POSTGRES_PASSWORD: psycourse_dev
      POSTGRES_DB: psycourse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psycourse -d psycourse"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kotak surat palsu untuk lokal: menangkap semua email yang dikirim aplikasi, tanpa
  # mengirim ke luar. Lihat emailnya di http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: psycourse-mail
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP, tujuan pengiriman aplikasi
      - "8025:8025" # tampilan web

volumes:
  db-data:
